<!DOCTYPE html>

    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <link rel="preconnect" href="https://fonts.googleapis.com">

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0&icon_names=menu" />

        <link rel="stylesheet" href="{{ site.baseurl }}/css/vendor/bootstrap.min.css">
        <link rel="stylesheet" href="{{ site.baseurl }}/css/main.min.css">
          
          <!-- Icons -->
    </head>
    <body>
        <!-- Navigation-->
        <nav class="navbar navbar-dark bg-dark fixed-top">
            <div class="container px-4 px-lg-5 text-end">

                        <li class="nav-item active"><a class="nav-link" href="#!">Home</a></li><!--

                    <div class="col-lg-6">
                        <h1 class="mt-5">{{ page.title }}</h1>
                        {{ content }}
                    </div>
                </div>
            </div>
        </section>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
